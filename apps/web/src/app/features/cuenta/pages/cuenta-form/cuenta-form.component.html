<section class="page">
  <div class="header">
    <div>
      <h1>{{ modoEdicion ? 'Editar cuenta' : 'Nueva cuenta' }}</h1>
      <p>{{ modoEdicion ? 'Actualiza los datos de la cuenta.' : 'Registra una nueva cuenta.' }}</p>
    </div>

    <a routerLink="/cuentas" class="btn">
      Volver
    </a>
  </div>

  <div *ngIf="cargando" class="info">
    Cargando información...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-card" *ngIf="!cargando">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" placeholder="Ej. Cuenta monetaria" />

      <small *ngIf="campoInvalido('nombre')">
        El nombre es obligatorio.
      </small>
    </div>

    <div class="form-group">
      <label>Tipo</label>
      <select formControlName="tipo">
        <option value="">Seleccione un tipo</option>
        <option value="monetaria">Monetaria</option>
        <option value="ahorro">Ahorro</option>
        <option value="efectivo">Efectivo</option>
        <option value="gasto">Gasto</option>
        <option value="inversion">Inversión</option>
      </select>

      <small *ngIf="campoInvalido('tipo')">
        El tipo es obligatorio.
      </small>
    </div>

    <div class="form-check">
      <input type="checkbox" id="activa" formControlName="activa" />
      <label for="activa">Cuenta activa</label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn primary" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>

      <a routerLink="/cuentas" class="btn">
        Cancelar
      </a>
    </div>
  </form>
</section>
