services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Guatemala
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database:/database:ro
      - ../../database/backups:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
    volumes:
      - ../../apps/api:/src
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:4200"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - app-network

  auth:
    build:
      context: ../../apps/auth
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME}-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      APP_ENV: development
      SERVER_PORT: 8081

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: disable

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES}
    volumes:
      - ../../apps/auth:/auth
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
   
volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge