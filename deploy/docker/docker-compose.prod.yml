services:
  database:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Guatemala
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database:/database:ro
      - ../../database/backups:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  auth:
    build:
      context: ../../apps/auth
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT}:8081"
    environment:
      APP_ENV: ${APP_ENV}
      SERVER_PORT: ${AUTH_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES}
    volumes:
      - ../../apps/auth:/auth
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
      - auth
    networks:
      - app-network

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge